<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sketchin3D — Spatial Studio</title>
  <style>
    :root {
      --bg-canvas: #141b2d;
      --surface: rgba(16, 22, 36, 0.86);
      --surface-elevated: rgba(24, 32, 50, 0.96);
      --surface-hover: rgba(88, 130, 214, 0.22);
      --border: rgba(173, 198, 238, 0.16);
      --border-strong: rgba(114, 165, 255, 0.62);
      --text: #f1f5fc;
      --text-muted: #98a8c7;
      --accent: #689bff;
      --accent-soft: rgba(104, 155, 255, 0.2);
      --danger: #ff6b7a;
      --shadow: 0 10px 28px rgba(4, 7, 15, 0.44);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html[data-theme="light"] {
      --bg-canvas: #f2f5fa;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-elevated: rgba(255, 255, 255, 0.97);
      --surface-hover: rgba(37, 99, 235, 0.11);
      --border: rgba(20, 32, 54, 0.14);
      --border-strong: rgba(37, 99, 235, 0.58);
      --text: #111827;
      --text-muted: #556581;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --danger: #dc2626;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-canvas);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      touch-action: none;
      display: block;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .rail {
      pointer-events: auto;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 6px;
      border-radius: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .popover {
      pointer-events: auto;
      position: fixed;
      border-radius: 18px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow: var(--shadow);
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      z-index: 30;
    }

    .popover.open { display: flex; }

    .icon-btn {
      width: 42px;
      height: 42px;
      min-width: 42px;
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      padding: 0;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .pill .icon-btn {
      border-radius: 999px;
      width: 38px;
      height: 38px;
      min-width: 38px;
      min-height: 38px;
    }

    .icon-btn:active { transform: scale(0.93); }
    .icon-btn:hover:not(:disabled) { background: var(--surface-hover); }
    .icon-btn.active {
      background: var(--accent-soft);
      border-color: var(--border-strong);
      color: var(--accent);
    }
    .icon-btn.danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }
    .icon-btn:disabled { opacity: 0.34; cursor: not-allowed; }
    .icon-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .sep-h {
      height: 1px;
      width: 24px;
      background: var(--border);
      margin: 1px 0;
    }
    .sep-v {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 1px;
    }
    #top-left {
      position: fixed;
      top: calc(10px + var(--safe-top));
      left: calc(10px + var(--safe-left));
    }
    #top-right {
      position: fixed;
      top: calc(10px + var(--safe-top));
      right: calc(10px + var(--safe-right));
    }
    #left-rail {
      position: fixed;
      top: calc(62px + var(--safe-top));
      left: calc(10px + var(--safe-left));
      max-height: calc(100dvh - 136px - var(--safe-top) - var(--safe-bottom));
      overflow-y: auto;
      scrollbar-width: none;
    }
    #left-rail::-webkit-scrollbar { display: none; }
    #guides-card {
      position: fixed;
      top: calc(62px + var(--safe-top));
      right: calc(10px + var(--safe-right));
      width: 226px;
    }
    #bottom-bar {
      position: fixed;
      bottom: calc(12px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 20px - var(--safe-left) - var(--safe-right));
      overflow-x: auto;
      scrollbar-width: none;
    }
    #bottom-bar::-webkit-scrollbar { display: none; }
    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
      display: block;
      pointer-events: none;
    }
    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .seg-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .seg-btn {
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      padding: 0 6px;
    }
    .seg-btn.active {
      background: var(--accent-soft);
      border-color: var(--border-strong);
      color: var(--accent);
    }
    .nudge-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .mini-btn {
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .mini-btn:active { transform: scale(0.95); }
    .mini-btn.active {
      background: var(--accent-soft);
      border-color: var(--border-strong);
      color: var(--accent);
    }
    .mini-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
    }
    #brush-pop {
      bottom: calc(64px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: min(350px, calc(100vw - 20px));
    }
    .swatch-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }
    .swatch.active {
      border-color: var(--text);
      transform: scale(1.12);
    }
    input[type="color"] {
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
    }
    .slider-line {
      display: grid;
      grid-template-columns: 20px 1fr 44px;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      margin: 0;
      height: 24px;
    }
    .brush-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 152px;
      overflow-y: auto;
    }
    .brush-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 10px;
      line-height: 1.1;
      position: relative;
    }
    .brush-item.active {
      background: var(--accent-soft);
      border-color: var(--border-strong);
      color: var(--accent);
    }
    .brush-item img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(128, 128, 128, 0.12);
    }
    .brush-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }
    .brush-name {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }
    .import-row { display: flex; gap: 6px; }
    .import-btn {
      flex: 1;
      height: 36px;
      border-radius: 11px;
      border: 1px dashed var(--border-strong);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .import-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
    #toast {
      position: fixed;
      top: calc(58px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 11px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 40;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #error-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 24, 0.9);
      color: #f8fafc;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    #error-overlay.open { display: flex; }
    .error-box {
      max-width: 360px;
      width: 100%;
      background: #1b2234;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .error-box pre {
      margin: 0;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #fca5a5;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 10px;
    }
    .retry-btn {
      height: 40px;
      border: none;
      border-radius: 12px;
      background: #4f86ff;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    /* Sketchin3D responsive refinements */
    button, input { font: inherit; }
    button { touch-action: manipulation; }
    #guides-card { max-height: calc(100dvh - 84px - var(--safe-top) - var(--safe-bottom)); overflow-y: auto; scrollbar-width: none; }
    #guides-card::-webkit-scrollbar { display: none; }
    #brush-pop { max-height: min(64dvh, 520px); overflow-y: auto; scrollbar-width: none; }
    #brush-pop::-webkit-scrollbar { display: none; }
    @media (max-width: 680px) {
      #top-left, #top-right { gap: 1px; padding: 3px; }
      #top-left .icon-btn, #top-right .icon-btn { width: 34px; height: 34px; min-width: 34px; min-height: 34px; }
      #top-left { left: calc(6px + var(--safe-left)); top: calc(6px + var(--safe-top)); }
      #top-right { right: calc(6px + var(--safe-right)); top: calc(6px + var(--safe-top)); }
      #left-rail { left: calc(6px + var(--safe-left)); top: calc(54px + var(--safe-top)); padding: 4px; gap: 3px; border-radius: 18px; }
      #left-rail .icon-btn { width: 38px; height: 38px; min-width: 38px; min-height: 38px; }
      #guides-card { top: calc(54px + var(--safe-top)); right: calc(6px + var(--safe-right)); width: min(188px, 48vw); padding: 9px; gap: 7px; }
      #bottom-bar { bottom: calc(7px + var(--safe-bottom)); gap: 1px; padding: 3px; }
      #bottom-bar .icon-btn { width: 36px; height: 36px; min-width: 36px; min-height: 36px; }
      .nudge-row { gap: 3px; }
      .mini-btn { height: 32px; font-size: 10px; }
      .seg-btn { height: 32px; }
      .card-title { font-size: 9px; }
    }
    @media (max-width: 390px) {
      #guides-card { width: 164px; }
      #top-left .icon-btn, #top-right .icon-btn { width: 32px; min-width: 32px; }
      #bottom-bar .icon-btn { width: 33px; min-width: 33px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div class="hud" id="hud">
    <div class="pill" id="top-left">
      <button class="icon-btn" id="btn-undo" title="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="icon-btn" id="btn-redo" title="Redo" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="icon-btn danger" id="btn-clear" title="Clear"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
      <div class="sep-v"></div>
      <button class="icon-btn" id="btn-save" title="Save JSON"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg></button>
      <button class="icon-btn" id="btn-load" title="Load JSON"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <div class="pill" id="top-right">
      <button class="icon-btn" id="btn-theme" title="Theme">
        <svg id="theme-icon-sun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg id="theme-icon-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
      <button class="icon-btn" id="btn-export-obj" title="Export OBJ"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg></button>
      <button class="icon-btn" id="btn-toggle-guides-card" title="Guides"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button>
    </div>
    <div class="rail" id="left-rail">
      <button class="icon-btn active" data-mode="draw" title="Draw"><svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg></button>
      <button class="icon-btn" data-mode="loft" title="Loft"><svg viewBox="0 0 24 24"><path d="M3 17c4-8 14-8 18 0"/><path d="M3 11c4-8 14-8 18 0"/><path d="M3 11v6"/><path d="M21 11v6"/></svg></button>
      <button class="icon-btn" data-mode="eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
      <button class="icon-btn" data-mode="bucket" title="Bucket · Fill closed shapes"><svg viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 2-3.5 2-3.5s2 1.9 2 3.5Z"/></svg></button>
      <button class="icon-btn" data-mode="pick" title="Pick"><svg viewBox="0 0 24 24"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg></button>
      <button class="icon-btn" data-mode="select" title="Select & Transform"><svg viewBox="0 0 24 24"><path d="M5 3v18l5-5 3 6 3-1.5-3-6H20L5 3Z"/><path d="M17 3h4v4"/></svg></button>
      <div class="sep-h"></div>
      <button class="icon-btn" id="btn-color-dot" title="Brushes, Color & Size"><span class="color-dot" id="active-color-dot" style="background:#56ccf2"></span></button>
    </div>
    <div class="popover" id="guides-card">
      <div class="card-row">
        <span class="card-title" id="plane-readout">XZ · 0.00 · 0°</span>
        <button class="mini-btn active" id="btn-plane-vis" title="Plane Visibility" style="width:32px;height:28px;"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="card-row" style="margin-top:2px;">
        <span class="card-title">Global XYZ Axis</span>
        <button class="mini-btn active" id="btn-global-axis" aria-pressed="true" title="Show or hide global X, Y and Z axes" style="min-width:48px;height:28px;">XYZ ON</button>
      </div>
      <div class="seg-grid">
        <button class="seg-btn active" data-plane="XZ" title="Floor XZ">XZ</button>
        <button class="seg-btn" data-plane="XY" title="Front XY">XY</button>
        <button class="seg-btn" data-plane="YZ" title="Side YZ">YZ</button>
      </div>
      <div class="nudge-row">
        <button class="mini-btn" id="btn-depth-minus" title="Depth -">D-</button>
        <button class="mini-btn" id="btn-depth-plus" title="Depth +">D+</button>
        <button class="mini-btn" id="btn-tilt-minus" title="Tilt -15°">-15°</button>
        <button class="mini-btn" id="btn-tilt-plus" title="Tilt +15°">+15°</button>
      </div>
      <div class="card-row">
        <span class="card-title" id="loft-count-label">Lofts: 0</span>
        <div style="display:flex;gap:5px;">
          <button class="mini-btn" id="btn-reset-plane" title="Reset Plane" style="padding:0 8px;height:28px;">0</button>
          <button class="mini-btn" id="btn-clear-lofts" title="Clear Lofts" style="padding:0 9px;height:28px;"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
        </div>
      </div>

          navigator.serviceWorker.register(swUrl).then(() => setTimeout(() => URL.revokeObjectURL(swUrl), 2000)).catch(() => {});
        } catch (_) {}
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', waitForLibsAndStart);
      else waitForLibsAndStart();
    })();
  </script>
